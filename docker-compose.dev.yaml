services:
  nc33:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NC_VERSION: 33
    ports:
      - 8033:8080
    volumes:
      - nc33-config:/nextcloud/config
      - nc33-data:/nextcloud/data
      - ./:/nextcloud/apps/openincryptpad:ro

  nc32:
      build:
        context: .
        dockerfile: Dockerfile.dev
        args:
          NC_VERSION: 32
      ports:
        - 8032:8080
      volumes:
        - nc32-config:/nextcloud/config
        - nc32-data:/nextcloud/data
        - ./:/nextcloud/apps/openincryptpad:ro

  nc31:
      build:
        context: .
        dockerfile: Dockerfile.dev
        args:
          NC_VERSION: 31
      ports:
        - 8031:8080
      volumes:
        - nc31-config:/nextcloud/config
        - nc31-data:/nextcloud/data
        - ./:/nextcloud/apps/openincryptpad:ro

volumes:
  nc33-config:
  nc33-data:
  nc32-config:
  nc32-data:
  nc31-config:
  nc31-data:
